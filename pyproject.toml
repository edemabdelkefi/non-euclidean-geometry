[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "non-euclidean-geometry"
version = "0.2.0"
description = "Affine-invariant covariance geometry and statistical portfolio risk"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scipy>=1.12"]

[project.scripts]
run-experiment = "geometry_lab.experiment:run"
geometry-research = "geometry_lab.research:main"

[tool.setuptools.packages.find]
where = ["src"]
