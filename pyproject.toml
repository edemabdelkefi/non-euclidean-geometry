[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "non-euclidean-geometry"
version = "0.1.0"
description = "Reproducible mathematical and quantitative research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
run-experiment = "geometry_lab.experiment:run"

[tool.setuptools.packages.find]
where = ["src"]
